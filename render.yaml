services:
  - type: web
    name: task-spinner
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class=gthread --workers=2 --threads=8 --timeout=3600 --bind=0.0.0.0:$PORT server:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
