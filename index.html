<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Task Orbit | Spin Your Productivity</title>
    <meta name="title" content="Task Orbit | Spin Your Productivity" />
    <meta
      name="description"
      content="A powerful task management wheel with integrated timers and batch import."
    />

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎡</text></svg>"
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Task Orbit" />
    <meta
      property="og:description"
      content="Decide your next task with a spin."
    />
    <meta
      property="og:image"
      content="https://picsum.photos/seed/taskorbit/1200/630"
    />

    <style>
      :root {
        --primary: #6366f1;
        --secondary: #f43f5e;
        --dark: #1e293b;
        --light: #f8fafc;
        --border: #e2e8f0;
        --success: #10b981;
      }
      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: #f1f5f9;
        display: flex;
        justify-content: center;
        padding: 20px;
        color: var(--dark);
      }
      .app-container {
        display: flex;
        gap: 30px;
        background: white;
        padding: 30px;
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        max-width: 1100px;
        width: 100%;
      }

      /* Branding */
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .brand-icon {
        width: 32px;
        height: 32px;
        background: conic-gradient(#ff6b6b, #4ecdc4, #ffe66d, #1a535c);
        border-radius: 50%;
        border: 2px solid var(--dark);
      }
      .brand h2 {
        margin: 0;
        color: var(--dark);
        font-size: 1.4rem;
        font-weight: 800;
      }

      /* Left Column Controls */
      .controls {
        flex: 1;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        padding-right: 30px;
        min-width: 320px;
      }
      #input-state,
      #list-state {
        display: none;
        flex-direction: column;
      }
      #input-state.active,
      #list-state.active {
        display: flex;
      }

      textarea {
        width: 100%;
        height: 350px;
        padding: 12px;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        font-family: "Courier New", monospace;
        font-size: 0.85rem;
        resize: none;
        box-sizing: border-box;
        background: var(--light);
      }

      /* Task List with Sync Colors */
      .task-list-display {
        max-height: 400px;
        overflow-y: auto;
        margin-bottom: 15px;
        border-radius: 12px;
        padding: 5px;
      }
      .list-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        background: white;
        border-radius: 8px;
        margin-bottom: 6px;
        font-size: 0.85rem;
        border: 1px solid #eee;
        border-left-width: 6px;
      }
      .del-x {
        color: #94a3b8;
        font-weight: bold;
        cursor: pointer;
        border: none;
        background: none;
        font-size: 1.2rem;
      }

      .action-btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 700;
        transition: 0.2s;
      }
      .btn-dark {
        background: var(--dark);
        color: white;
        margin-bottom: 10px;
      }
      .btn-outline {
        background: white;
        border: 2px solid var(--dark);
        color: var(--dark);
        margin-bottom: 15px;
      }
      .btn-repeat {
        background: var(--success);
        color: white;
        display: none;
        font-size: 1rem;
        margin-top: 10px;
        box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
      }

      /* Right Column Wheel */
      .wheel-box {
        flex: 1.5;
        text-align: center;
      }
      #current-task-name {
        font-size: 1.6rem;
        font-weight: 800;
        color: var(--primary);
        height: 1.5em;
        margin-bottom: 10px;
      }
      #wheel-wrapper {
        position: relative;
        display: inline-block;
      }
      .pointer {
        position: absolute;
        top: -15px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 15px solid transparent;
        border-right: 15px solid transparent;
        border-top: 30px solid var(--dark);
        z-index: 10;
      }
      canvas {
        border: 8px solid var(--dark);
        border-radius: 50%;
        background: white;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      }

      #spin-btn {
        margin-top: 25px;
        width: 80%;
        padding: 18px;
        background: var(--secondary);
        color: white;
        border: none;
        border-radius: 50px;
        font-weight: 800;
        font-size: 1.2rem;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(244, 63, 94, 0.2);
        transition: transform 0.1s;
      }
      #spin-btn:active {
        transform: scale(0.96);
      }
      #timer-display {
        font-size: 5.5rem;
        font-weight: 900;
        color: var(--dark);
        margin: 10px 0;
        font-variant-numeric: tabular-nums;
        letter-spacing: -2px;
      }

      .settings-bar {
        margin-top: auto;
        padding: 12px;
        background: var(--light);
        border-radius: 12px;
        font-size: 0.8rem;
        border: 1px dashed #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="controls">
        <div class="brand">
          <div class="brand-icon"></div>
          <h2>Task Orbit</h2>
        </div>

        <div id="input-state" class="active">
          <button class="action-btn btn-dark" onclick="importAndSwitch()">
            Update Wheel & Manage
          </button>
          <textarea id="batchInput" placeholder="Task Name	25	O"></textarea>
        </div>

        <div id="list-state">
          <button class="action-btn btn-outline" onclick="showInputState()">
            ← Edit List
          </button>
          <div id="taskListView" class="task-list-display"></div>
        </div>

        <button
          id="repeatBtn"
          class="action-btn btn-repeat"
          onclick="repeatCurrentTask()"
        >
          Repeat Same Task
        </button>

        <div class="settings-bar">
          <strong>Upload Alarm:</strong><br />
          <input
            type="file"
            id="audioUpload"
            accept="audio/*"
            onchange="loadCustomAudio(event)"
            style="margin-top: 5px; font-size: 0.75rem"
          />
        </div>
      </div>

      <div class="wheel-box">
        <div id="current-task-name">Welcome</div>
        <div id="wheel-wrapper">
          <div class="pointer"></div>
          <canvas id="wheel" width="400" height="400"></canvas>
        </div>
        <button id="spin-btn" onclick="spinWheel()">SPIN THE WHEEL</button>
        <div id="timer-display">00:00</div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("wheel");
      const ctx = canvas.getContext("2d");
      const colors = [
        "#6366f1",
        "#f43f5e",
        "#10b981",
        "#f59e0b",
        "#8b5cf6",
        "#ec4899",
        "#06b6d4",
        "#2dd4bf",
        "#fbbf24",
        "#a855f7",
      ];

      let tasks = [];
      let currentActiveTask = null;
      let currentAudio = null;
      let customAudioBlob = null;
      let startAngle = 0;
      let arc = 0;
      let countdownInterval;

      function loadCustomAudio(event) {
        const file = event.target.files[0];
        if (file) customAudioBlob = URL.createObjectURL(file);
      }

      function stopAudio() {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }
      }

      function importAndSwitch() {
        const text = document.getElementById("batchInput").value.trim();
        if (!text) return alert("Enter your tasks first!");

        const lines = text.split("\n");
        tasks = [];
        lines.forEach((line) => {
          const parts = line.split(/\t| {2,}/);
          if (parts.length >= 3) {
            tasks.push({
              name: parts[0].trim(),
              time: parseInt(parts[1].trim()),
              repeatable: parts[2].trim().toUpperCase() === "O",
            });
          }
        });

        renderTaskList();
        drawWheel();
        document.getElementById("input-state").classList.remove("active");
        document.getElementById("list-state").classList.add("active");
        localStorage.setItem("savedBatch", text);
      }

      function showInputState() {
        document.getElementById("list-state").classList.remove("active");
        document.getElementById("input-state").classList.add("active");
      }

      function renderTaskList() {
        const container = document.getElementById("taskListView");
        container.innerHTML = tasks
          .map((t, i) => {
            const itemColor = colors[i % colors.length];
            return `<div class="list-item" style="border-left-color: ${itemColor}">
                <span><strong>${t.name}</strong> (${t.time}m)</span>
                <button class="del-x" onclick="removeTask(${i})">✕</button>
            </div>`;
          })
          .join("");
      }

      function removeTask(index) {
        tasks.splice(index, 1);
        renderTaskList();
        drawWheel();
        const updatedText = tasks
          .map((t) => `${t.name}\t${t.time}\t${t.repeatable ? "O" : "X"}`)
          .join("\n");
        document.getElementById("batchInput").value = updatedText;
        localStorage.setItem("savedBatch", updatedText);
      }

      function drawWheel() {
        if (tasks.length === 0) {
          ctx.clearRect(0, 0, 400, 400);
          return;
        }
        arc = Math.PI / (tasks.length / 2);
        ctx.clearRect(0, 0, 400, 400);
        tasks.forEach((task, i) => {
          const angle = startAngle + i * arc;
          ctx.fillStyle = colors[i % colors.length];
          ctx.beginPath();
          ctx.moveTo(200, 200);
          ctx.arc(200, 200, 190, angle, angle + arc, false);
          ctx.fill();
          ctx.save();
          ctx.fillStyle = "white";
          ctx.translate(
            200 + Math.cos(angle + arc / 2) * 135,
            200 + Math.sin(angle + arc / 2) * 135
          );
          ctx.rotate(angle + arc / 2 + Math.PI / 2);
          ctx.font = "bold 11px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(task.name.substring(0, 14), 0, 0);
          ctx.restore();
        });
      }

      function spinWheel() {
        if (tasks.length === 0) return;
        stopAudio();
        clearInterval(countdownInterval);
        document.getElementById("repeatBtn").style.display = "none";

        let spinAngleStart = Math.random() * 10 + 10;
        let spinTime = 0;
        let spinTimeTotal = Math.random() * 3 + 3000;

        const rotate = () => {
          spinTime += 30;
          if (spinTime >= spinTimeTotal) {
            const degrees = (startAngle * 180) / Math.PI + 90;
            const index =
              Math.floor((360 - (degrees % 360)) / ((arc * 180) / Math.PI)) %
              tasks.length;
            currentActiveTask = tasks[index];
            document.getElementById("current-task-name").innerText =
              currentActiveTask.name;
            startTimer(currentActiveTask.time * 60);
            return;
          }
          startAngle +=
            ((spinAngleStart -
              easeOut(spinTime, 0, spinAngleStart, spinTimeTotal)) *
              Math.PI) /
            180;
          drawWheel();
          setTimeout(rotate, 30);
        };
        rotate();
      }

      function repeatCurrentTask() {
        if (currentActiveTask) {
          stopAudio();
          document.getElementById("repeatBtn").style.display = "none";
          startTimer(currentActiveTask.time * 60);
        }
      }

      function startTimer(seconds) {
        clearInterval(countdownInterval);
        const display = document.getElementById("timer-display");
        const endTime = Date.now() + seconds * 1000;

        function tick() {
          const remaining = Math.ceil((endTime - Date.now()) / 1000);
          if (remaining <= 0) {
            clearInterval(countdownInterval);
            display.textContent = "00:00";
            if (customAudioBlob) {
              currentAudio = new Audio(customAudioBlob);
              currentAudio.play();
            }
            if (currentActiveTask.repeatable)
              document.getElementById("repeatBtn").style.display = "block";
            alert("Task Complete!");
            return;
          }
          let m = Math.floor(remaining / 60);
          let s = remaining % 60;
          display.textContent = `${m.toString().padStart(2, "0")}:${s
            .toString()
            .padStart(2, "0")}`;
        }

        tick();
        countdownInterval = setInterval(tick, 500);
      }

      function easeOut(t, b, c, d) {
        const ts = (t /= d) * t;
        const tc = ts * t;
        return b + c * (tc + -3 * ts + 3 * t);
      }

      window.onload = () => {
        const saved = localStorage.getItem("savedBatch");
        if (saved) {
          document.getElementById("batchInput").value = saved;
          importAndSwitch();
        }
      };
    </script>
  </body>
</html>
